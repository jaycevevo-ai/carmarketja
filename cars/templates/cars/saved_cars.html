<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Saved Cars</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:0;
        }

        .topbar{
            padding:15px;
            background:white;
            border-bottom:1px solid #ddd;
        }

        .page-wrap{
            width:90%;
            margin:30px auto;
        }

        .car-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
            gap:20px;
        }

        .car-card{
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .car-card img{
            width:100%;
            height:180px;
            object-fit:cover;
            display:block;
        }

        .car-info{
            padding:14px;
        }

        .car-title{
            font-size:18px;
            font-weight:bold;
            margin-bottom:6px;
        }

        .car-price{
            font-size:20px;
            font-weight:bold;
            color:#333;
            margin-bottom:6px;
        }

        .action-btn{
            display:inline-block;
            background:#f4b400;
            color:black;
            padding:10px 16px;
            border-radius:6px;
            font-weight:bold;
            text-decoration:none;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <a href="{% url 'home' %}">
        <img src="{% static 'images/logo.png' %}" alt="CarMarketJA" style="height:50px;">
    </a>
</div>

<div class="page-wrap">
    <h1>Saved Cars</h1>

    <div class="car-grid">
        {% for favorite in favorites %}
        <div class="car-card">
            {% if favorite.car.image %}
                <img src="{{ favorite.car.image.url }}" alt="{{ favorite.car.title }}">
            {% endif %}

            <div class="car-info">
                <div class="car-title">{{ favorite.car.title }}</div>
                <div class="car-price">J${{ favorite.car.price|floatformat:0 }}</div>
                <a href="{% url 'car_detail' favorite.car.id %}" class="action-btn">View Details</a>
            </div>
        </div>
        {% empty %}
            <p>You have no saved cars yet.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
