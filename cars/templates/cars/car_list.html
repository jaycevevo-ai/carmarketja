<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Cars for Sale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .logo {
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .page-wrap {
            width: 90%;
            margin: 30px auto;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .car-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .car-image-link {
            display: block;
        }

        .car-image-link img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .car-info {
            padding: 14px;
        }

        .car-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .car-price {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .car-meta {
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="logo">
        <a href="{% url 'home' %}">
            <img src="{% static 'images/logo.png' %}" alt="CarMarketJA" style="height:50px;">
        </a>
    </div>

    <div class="page-wrap">
        <div class="car-grid">

            {% for car in cars %}
            <div class="car-card">

                <a class="car-image-link" href="/cars/{{ car.id }}/">
                    {% if car.image %}
                        <img src="{{ car.image.url }}" alt="{{ car.title }}">
                    {% else %}
                        <img src="{% static 'images/logo.png' %}" alt="No image">
                    {% endif %}
                </a>

                <div class="car-info">
                    <div class="car-title">{{ car.title }}</div>
                    <div class="car-price">J${{ car.price }}</div>
                    <div class="car-meta">{{ car.make }} • {{ car.model }} • {{ car.year }}</div>
                </div>

            </div>
            {% endfor %}

        </div>
    </div>

</body>
</html>
